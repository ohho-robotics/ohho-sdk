name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run codegen:schemas -- --check
      - run: npm run codegen:telemetry -- --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r generated/python/requirements.txt
      - run: python generated/python/test_telemetry_vectors.py

  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build generated/csharp/Ohho.Schemas/Ohho.Schemas.csproj --configuration Release
      - run: dotnet test generated/csharp/Ohho.Schemas.Tests/Ohho.Schemas.Tests.csproj --configuration Release

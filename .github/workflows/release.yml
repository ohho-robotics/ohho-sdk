# Manual npm publish for @ohho/connect, @ohho/schemas, and @ohho/client.
# @ohho/mcp stays private (OHH-173). Enable only after npm scope access is verified.
#
# To use: set `on.workflow_dispatch` below (currently disabled), add NPM_TOKEN repo secret,
# then run from the Actions tab. Do NOT publish @ohho/mcp.

name: Release (disabled)

on:
  workflow_dispatch:
    # Intentionally no automatic triggers — manual dispatch only when enabled by maintainers.

jobs:
  publish:
    if: false
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace=@ohho/schemas --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace=@ohho/connect --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace=@ohho/client --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
